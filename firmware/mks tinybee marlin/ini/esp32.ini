#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
[env:esp32]
platform      = espressif32@2.1.0 
board         = esp32dev
build_flags   = ${common.build_flags} -DCORE_DEBUG_LEVEL=0
src_filter    = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore    = NativeEthernet
; upload_speed  = 500000
; monitor_speed = 250000
upload_speed = 921600
monitor_speed = 250000
#upload_port   = marlinesp.local
#board_build.flash_mode = qio

[env:FYSETC_E4]
platform               = espressif32@2.1.0 
extends                = env:esp32
board_build.partitions = default_16MB.csv

[env:mks_tinybee]
lib_deps =
  ${common.lib_deps}
  ESP3DLib
extends                = env:esp32
platform               = espressif32@2.1.0 
board_build.partitions = default_8MB.csv
# The '+' modes (deep+, chain+) run PlatformIO's Python preprocessor
# evaluator, which doesn't know the full ESP32 framework macro set.
# It treats #include lines inside #ifdef as dead code and skips their
# include paths, so ESP3DLib fails with "WiFi.h: No such file or
# directory". Plain 'deep' scans all #includes unconditionally and works.
lib_ldf_mode           = deep
; upload_port = COM9